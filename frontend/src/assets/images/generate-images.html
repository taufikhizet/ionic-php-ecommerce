<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Product Images</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .image-container {
        margin: 20px 0;
      }
      canvas {
        border: 1px solid #ccc;
        margin: 10px;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Generate Product Images</h1>
    <button onclick="generateAllImages()">Generate All Images</button>

    <div id="images-container"></div>

    <script>
      const products = [
        { name: "smartphone_x1", text: "📱 Smartphone X1", color: "#007bff" },
        { name: "laptop_pro", text: "💻 Laptop Pro", color: "#28a745" },
        {
          name: "wireless_headphones",
          text: "🎧 Headphones",
          color: "#dc3545",
        },
        { name: "tshirt_cotton", text: "👕 T-Shirt", color: "#fd7e14" },
        { name: "jeans_classic", text: "👖 Jeans", color: "#6610f2" },
        { name: "programming_book", text: "📚 Book", color: "#e83e8c" },
        { name: "plant_pot", text: "🪴 Plant Pot", color: "#20c997" },
      ];

      const categories = [
        { name: "electronics", text: "⚡ Electronics", color: "#007bff" },
        { name: "clothing", text: "👔 Clothing", color: "#fd7e14" },
        { name: "books", text: "📖 Books", color: "#e83e8c" },
        { name: "home", text: "🏠 Home & Garden", color: "#20c997" },
      ];

      function createImage(item, type) {
        const canvas = document.createElement("canvas");
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext("2d");

        // Background
        ctx.fillStyle = item.color;
        ctx.fillRect(0, 0, 300, 300);

        // Text
        ctx.fillStyle = "white";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(item.text, 150, 150);

        // Border
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, 296, 296);

        const container = document.getElementById("images-container");
        const div = document.createElement("div");
        div.className = "image-container";
        div.innerHTML = `<h3>${item.name}.jpg</h3>`;
        div.appendChild(canvas);

        const downloadBtn = document.createElement("button");
        downloadBtn.textContent = `Download ${item.name}.jpg`;
        downloadBtn.onclick = () => downloadImage(canvas, `${item.name}.jpg`);
        div.appendChild(downloadBtn);

        container.appendChild(div);
      }

      function downloadImage(canvas, filename) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/jpeg", 0.8);
        link.click();
      }

      function generateAllImages() {
        document.getElementById("images-container").innerHTML = "";

        products.forEach((product) => createImage(product, "product"));
        categories.forEach((category) => createImage(category, "category"));
      }

      // Auto generate on load
      window.onload = generateAllImages;
    </script>
  </body>
</html>
