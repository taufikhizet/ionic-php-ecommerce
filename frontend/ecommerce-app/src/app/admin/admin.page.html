<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Admin - Manage Products</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Admin Panel</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Products Grid -->
  <ion-grid>
    <ion-row>
      <ion-col
        size="12"
        size-md="6"
        size-lg="4"
        *ngFor="let product of products"
      >
        <ion-card>
          <ion-img
            [src]="getProductImage(product.image)"
            [alt]="product.name"
            style="height: 200px; object-fit: cover"
          >
          </ion-img>
          <ion-card-header>
            <ion-card-title>{{product.name}}</ion-card-title>
            <ion-card-subtitle>
              ${{product.price}} | {{getCategoryName(product.category_id)}}
              <ion-badge color="secondary" *ngIf="product.stock <= 5">
                Low Stock: {{product.stock}}
              </ion-badge>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{product.description}}</p>
            <div class="admin-actions">
              <ion-button
                fill="outline"
                size="small"
                color="primary"
                (click)="openEditModal(product)"
              >
                <ion-icon name="create" slot="start"></ion-icon>
                Edit
              </ion-button>
              <ion-button
                fill="outline"
                size="small"
                color="danger"
                (click)="deleteProduct(product)"
              >
                <ion-icon name="trash" slot="start"></ion-icon>
                Delete
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Floating Action Button for Add Product -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openCreateModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
