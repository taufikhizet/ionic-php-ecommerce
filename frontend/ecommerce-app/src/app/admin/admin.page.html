<div class="admin-header enhanced-header">
  <div class="header-actions-left">
    <ion-button (click)="goBack()" fill="clear">
      <ion-icon name="arrow-back"></ion-icon>
    </ion-button>
  </div>
  <div class="brand-section">
    <div class="brand-icon">
      <ion-icon name="shield-checkmark"></ion-icon>
    </div>
    <div class="brand-text">
      <p class="app-name">Admin Panel</p>
      <p class="app-tagline">Manage Products</p>
    </div>
  </div>
  <div class="header-actions-right">
    <ion-button (click)="openCreateModal()" fill="clear">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-button>
  </div>
</div>

<ion-content [fullscreen]="true">
  <!-- Products Grid -->
  <ion-grid>
    <ion-row>
      <ion-col
        size="12"
        size-md="6"
        size-lg="4"
        *ngFor="let product of products"
      >
        <ion-card>
          <ion-img
            [src]="getProductImage(product.image)"
            [alt]="product.name"
            style="height: 200px; object-fit: cover"
          >
          </ion-img>
          <ion-card-header>
            <ion-card-title>{{product.name}}</ion-card-title>
            <ion-card-subtitle>
              ${{product.price}} | {{getCategoryName(product.category_id)}}
              <ion-badge color="secondary" *ngIf="product.stock <= 5">
                Low Stock: {{product.stock}}
              </ion-badge>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{product.description}}</p>
            <div class="admin-actions">
              <ion-button
                fill="outline"
                size="small"
                color="primary"
                (click)="openEditModal(product)"
              >
                <ion-icon name="create" slot="start"></ion-icon>
                Edit
              </ion-button>
              <ion-button
                fill="outline"
                size="small"
                color="danger"
                (click)="deleteProduct(product)"
              >
                <ion-icon name="trash" slot="start"></ion-icon>
                Delete
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
