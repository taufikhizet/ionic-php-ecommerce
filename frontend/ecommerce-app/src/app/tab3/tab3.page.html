<div class="profile-header enhanced-header">
  <div class="header-actions-left">
    <!-- Space for future back button if needed -->
  </div>
  <div class="brand-section">
    <div class="brand-icon">
      <ion-icon name="person-circle"></ion-icon>
    </div>
    <div class="brand-text">
      <p class="app-name">Profile</p>
      <p class="app-tagline">Manage your account</p>
    </div>
  </div>
  <div class="header-actions-right">
    <ion-button
      *ngIf="isLoggedIn && currentUser?.role === 'admin'"
      (click)="openAdmin()"
      fill="clear"
      class="admin-button"
    >
      <ion-icon name="shield-outline" color="warning"></ion-icon>
      <span class="admin-text">Admin Panel</span>
    </ion-button>
  </div>
</div>

<ion-content [fullscreen]="true">
  <!-- User Profile (when logged in) -->
  <div *ngIf="isLoggedIn && currentUser" class="profile-section">
    <div class="profile-info-header">
      <div class="avatar">
        <ion-icon name="person-circle" size="large"></ion-icon>
      </div>
      <h2>{{currentUser.name}}</h2>
      <p>{{currentUser.email}}</p>
    </div>

    <ion-list>
      <ion-item button (click)="navigateToEditProfile()">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>Edit Profile</ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>Addresses</ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="card-outline" slot="start"></ion-icon>
        <ion-label>Payment Methods</ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="receipt-outline" slot="start"></ion-icon>
        <ion-label>Order History</ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Settings</ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>

      <ion-item button (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label color="danger">Logout</ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- Login/Register Form (when not logged in) -->
  <div *ngIf="!isLoggedIn" class="auth-section">
    <ion-segment [(ngModel)]="authMode" (ionChange)="onAuthModeChange($event)">
      <ion-segment-button value="login">
        <ion-label>Login</ion-label>
      </ion-segment-button>
      <ion-segment-button value="register">
        <ion-label>Register</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- Login Form -->
    <form *ngIf="authMode === 'login'" (ngSubmit)="login()" #loginForm="ngForm">
      <ion-list>
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            [(ngModel)]="loginData.email"
            name="email"
            required
            email
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="loginData.password"
            name="password"
            required
          >
          </ion-input>
        </ion-item>
      </ion-list>

      <div class="form-buttons">
        <ion-button
          expand="block"
          type="submit"
          [disabled]="!loginForm.form.valid || isLoading"
        >
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Login</span>
        </ion-button>
      </div>
    </form>

    <!-- Register Form -->
    <form
      *ngIf="authMode === 'register'"
      (ngSubmit)="register()"
      #registerForm="ngForm"
    >
      <ion-list>
        <ion-item>
          <ion-input
            label="Full Name"
            labelPlacement="stacked"
            type="text"
            [(ngModel)]="registerData.name"
            name="name"
            required
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            [(ngModel)]="registerData.email"
            name="email"
            required
            email
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Phone"
            labelPlacement="stacked"
            type="tel"
            [(ngModel)]="registerData.phone"
            name="phone"
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-textarea
            label="Address"
            labelPlacement="stacked"
            [(ngModel)]="registerData.address"
            name="address"
            rows="3"
          >
          </ion-textarea>
        </ion-item>

        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="registerData.password"
            name="password"
            required
            minlength="6"
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Confirm Password"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            minlength="6"
          >
          </ion-input>
        </ion-item>
      </ion-list>

      <div class="form-buttons">
        <ion-button
          expand="block"
          type="submit"
          [disabled]="!registerForm.form.valid || registerData.password !== confirmPassword || isLoading"
        >
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Register</span>
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
